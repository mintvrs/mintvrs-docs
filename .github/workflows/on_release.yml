name: Release tag

on:
  push:
    tags:
      - v*

jobs:
  create-artifact:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@v1

      - name: Get repository name
        run: echo "REPO_NAME=$(cut -d'/' -f2 <<< "${GITHUB_REPOSITORY}")" >> $GITHUB_ENV

      - name: Auth to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/556637128388/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: artifact-registry-rw@vaulted-program-487919-g2.iam.gserviceaccount.com

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: southamerica-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: southamerica-east1-docker.pkg.dev/vaulted-program-487919-g2/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mkclub69
          repositories: mk-microservice-ops

      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: mkclub69/mk-microservice-ops
          token: ${{ steps.app-token.outputs.token }}
          path: ops-repo

      - name: Update image tag in kustomization.yaml
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: >
            yq e '.images[0].newTag = "${{ steps.tag.outputs.tag }}"' -i
            ops-repo/${{ env.REPO_NAME }}/kustomization.yaml

      - name: Commit and push to ops repo
        run: |
          cd ops-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ${{ env.REPO_NAME }}/kustomization.yaml
          git commit -m "chore(${{ env.REPO_NAME }}): update image to ${{ steps.tag.outputs.tag }}"
          git push
