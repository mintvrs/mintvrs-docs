# ============================================================================
# Release tag — build + push da imagem arm64 e bump do kustomization no GitOps.
#
#   - tag v*  -> Build imagem arm64 em <repo>:<tag> no ECR. Bump kustomization
#                em mkclub69/mk-microservice-ops/<repo>/ (branch aws). ArgoCD
#                reaplica.
# ============================================================================
name: Release tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write       # required for AWS OIDC (configure-aws-credentials)

env:
  ECR_REGISTRY: 245111010865.dkr.ecr.us-east-1.amazonaws.com
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::245111010865:role/mintvrs-github-actions-ecr

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image-name: ${{ steps.meta.outputs.image-name }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup metadata
        id: meta
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "image-name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Auth AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ECR_REGISTRY }}/${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.image-tag }}

  # ===========================================================================
  # GitOps bump — atualiza newTag do kustomization em
  # mkclub69/mk-microservice-ops/<repo>/ (branch aws). ArgoCD reaplica.
  # Path explicito: o dir do docs nao tem sufixo -prod/-homolog.
  # ===========================================================================
  gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: widesoftware-dev/github-workflows/.github/actions/gitops-bump@v1.16.8
        with:
          gitops-repo: 'mkclub69/mk-microservice-ops'
          gitops-branch: 'aws'
          path-template: '{repo}/kustomization.yaml'
          app-id: ${{ vars.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          image-name: ${{ needs.build-and-push.outputs.image-name }}
          image-tag: ${{ needs.build-and-push.outputs.image-tag }}
